<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lời Tỏ Tình Đêm Trăng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                        'dancing-script': ['"Dancing Script"', 'cursive'],
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(5%)' },
                        },
                        twinkle: {
                            '0%, 100%': { opacity: 0.5, transform: 'scale(0.8)' },
                            '50%': { opacity: 1, transform: 'scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        heartBeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '10%, 30%': { transform: 'scale(0.95)' },
                            '20%, 40%': { transform: 'scale(1.05)' },
                        }
                    },
                    animation: {
                        'float-slow': 'float 12s ease-in-out infinite',
                        'float-medium': 'float 8s ease-in-out infinite',
                        'float-fast': 'float 5s ease-in-out infinite',
                        'twinkle': 'twinkle 3s ease-in-out infinite',
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'heart-beat': 'heartBeat 1.5s ease-in-out infinite',
                    },
                },
            },
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0"
  }
}
</script>
</head>
<body class="font-nunito">
<div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
